name: cicd pipeline

on:
  workflow_dispatch:

jobs:

  build_angular:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install run-time dependencies
        working-directory: jiejiechen-angular
        run: npm ci --omit=dev --legacy-peer-deps

      - name: Save run-time dependencies for packaging
        working-directory: jiejiechen-angular
        run: cp -R . ../package

      - name: Build
        working-directory: jiejiechen-angular
        run: |
          npm ci --legacy-peer-deps
          npm run lint
          npm run test:headless
          npm run build

      - name: Smoke-test default Lambda container command
        working-directory: jiejiechen-angular
        run: |
          docker build --pull -t angular-ssr-smoke .
          docker run -d --name angular-ssr-smoke -p 127.0.0.1:14001:4001 angular-ssr-smoke
          trap 'docker rm -f angular-ssr-smoke' EXIT
          for attempt in {1..30}; do
            if curl --max-time 10 -fsS -o /tmp/angular-ssr.html http://127.0.0.1:14001/background; then
              break
            fi
            sleep 2
          done
          grep -q 'Portfolio' /tmp/angular-ssr.html
          curl -fsSI http://127.0.0.1:14001/background | grep -qi 'content-security-policy:'

      - name: Save run-time dependencies for packaging
        working-directory: jiejiechen-angular
        run: cp -R dist ../package

      - name: Zip artifact
        working-directory: ./package
        run: zip jiejiechen-angular.zip ./* -r

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jiejiechen_angular
          path: package/jiejiechen-angular.zip

  build_html2docx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8
      - name: Install dependencies
        working-directory: ./services/
        run: dotnet restore
      - name: Test
        working-directory: ./services/
        run: dotnet test
      - name: Build
        working-directory: ./services/src/JiejieChenApp.HtmlDocx
        run: |
          dotnet build --configuration Release --no-restore
          dotnet publish -c Release -o ../../package -r linux-x64 --self-contained true
      - name: Zip artifact
        working-directory: ./services/package
        run: zip html2docx.zip ./* -r
          
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: html2docx
          path: services/package/html2docx.zip
